apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-pulse
  namespace: cloudops-pulse
  labels:
    app.kubernetes.io/name: cloudops-pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-pulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-pulse
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Image published by .github/workflows/deploy.yml
          # (manual workflow_dispatch run) to GHCR.
          image: ghcr.io/anshchaudhary289-prog/cloudops-pulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
