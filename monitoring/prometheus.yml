global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "cloudops-pulse"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: cloudops-pulse

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
